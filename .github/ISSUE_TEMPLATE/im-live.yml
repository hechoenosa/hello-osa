name: "🧱 I'm in! (join the Wall)"
description: Send your idea and join the Wall. Your weekly updates for Weeks 1–2 go in this issue's comments.
title: "I'm in: "
labels: ["wall"]
body:
  - type: markdown
    attributes:
      value: |
        **Title:** `I'm in: your-handle`. Use first names or roles only, no surnames.
  - type: textarea
    id: what
    attributes:
      label: "💡 My idea: what is it?"
      description: One or two sentences. It's fine if it changes later.
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who is it for?
      placeholder: "Surfers in Dominical, my little sister, the farmers at the feria..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is their problem?
    validations:
      required: true
  - type: input
    id: person
    attributes:
      label: One person I can talk to about it
      description: A first name or a role only, like "my uncle who fishes in Uvita".
    validations:
      required: true
  - type: checkboxes
    id: tools
    attributes:
      label: My tools
      options:
        - label: VS Code and Git are installed, and `git --version` works (or I use Codespaces)
          required: true
  - type: input
    id: link
    attributes:
      label: "🎁 My live website (optional)"
      placeholder: https://your-handle.github.io/hello-osa
  - type: textarea
    id: about
    attributes:
      label: One sentence about me (optional)
